[project]
name = "macd-trader"
version = "0.1.0"
description = "Standalone WebSocket-first MACD trading terminal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "fyers-apiv3>=3.1",
  # The trade-by-trade socket decodes protobuf (fyers_apiv3.FyersWebsocket.msg_pb2
  # imports google.protobuf). The SDK does not declare it, so without this the
  # TBT feed raises ModuleNotFoundError the moment it is touched.
  "protobuf>=4.25",
  "httpx>=0.27",
  # Event and response encoding: ~10x faster than the stdlib path it replaced.
  "orjson>=3.9",
  "pydantic-settings>=2.2",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
