name: macd-mini-parallel

services:
  # The strategy process: the only Fyers client, the MACD and blast lanes,
  # and the publisher of every accepted tick to the bus. MACD_ENGINE_ROLE=all
  # (with DESK_URL= for the gateway) puts the whole engine back in this one
  # process; the desk process then idles on its own.
  engine:
    # This deployment's own copy of the engine (see engine/README.md).
    build:
      context: ./engine
    image: macd-mini-parallel-engine
    environment:
      MACD_ENGINE_ROLE: ${MACD_ENGINE_ROLE:-strategy}
      MACD_NATS_URL: nats://nats:4222
      MACD_DESK_URL: http://desk:8100
      <<: &engine-databases
        # SQLite files live on a named volume, not the macOS bind mount: the
        # strategy and desk processes share historical.sqlite3, and only a
        # local filesystem gives SQLite reliable cross-process locking.
        MACD_DATABASE_PATH: /app/data/macd_trader.sqlite3
        MACD_RESEARCH_DATABASE_PATH: /app/data/historical.sqlite3
        MACD_MP_DATABASE_PATH: /app/data/mp_trader.sqlite3
        MACD_BLAST_DATABASE_PATH: /app/data/blast_trader.sqlite3
        MACD_TICK_DATABASE_PATH: /app/data/ticks.sqlite3
      MACD_FEED_MODE: fyers
      MACD_EXECUTION_MODE: paper
      MACD_ALLOW_LIVE_ORDERS: "false"
      MACD_AUTO_TRADE: "false"
      # Empty means the complete maintained NSE F&O stock universe plus indices.
      MACD_SYMBOLS_CSV: ${MACD_SYMBOLS_CSV:-}
      MACD_TIMEFRAME_SECONDS: ${MACD_TIMEFRAME_SECONDS:-60}
      MACD_RUNTIME_DIR: /app/runtime
      MACD_FYERS_CLIENT_ID: ${MACD_FYERS_CLIENT_ID:-}
      MACD_FYERS_SECRET: ${MACD_FYERS_SECRET:-}
      MACD_FYERS_ACCESS_TOKEN: ${MACD_FYERS_ACCESS_TOKEN:-}
      MACD_ALLOWED_ORIGINS_CSV: ${MACD_ALLOWED_ORIGINS_CSV:-}
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
    volumes:
      - ./runtime:/app/runtime
      - engine_data:/app/data
    depends_on:
      - nats
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # The Market Profile / order-flow lane: the auction desk and its book, tick
  # capture, the whale tracker and nightly memory. Same image, fed by the tick
  # bus and by the engine's contract context; broker calls and settings saves
  # go through the engine. Idle unless the engine runs as "strategy".
  desk:
    image: macd-mini-parallel-engine
    environment:
      MACD_ENGINE_ROLE: desk
      MACD_NATS_URL: nats://nats:4222
      MACD_STRATEGY_URL: http://engine:8100
      <<: *engine-databases
      MACD_RUNTIME_DIR: /app/runtime
      MACD_LISTEN_HOST: 0.0.0.0
      MACD_EXECUTION_MODE: paper
      MACD_ALLOW_LIVE_ORDERS: "false"
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
    volumes:
      # Read-only: the engine owns settings.json and the credentials.
      - ./runtime:/app/runtime:ro
      - engine_data:/app/data
    depends_on:
      engine:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3))['ok']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - questdb_fyers_data:/var/lib/questdb
    restart: unless-stopped

  # Tick bus. Core NATS, no persistence: the engine's SQLite capture and
  # QuestDB are the durable records; the bus only fans ticks out.
  nats:
    image: nats:2.10-alpine
    command: ["--http_port", "8222"]
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
    environment:
      PORT: "8081"
      QUESTDB_ADDR: questdb:9009
      QUESTDB_HTTP_URL: http://questdb:9000
      # Raw ticks in QuestDB expire after 5 days; "off" keeps only 1-minute bars.
      QUESTDB_STORE_TICKS: ${QUESTDB_STORE_TICKS:-on}
      NATS_ADDR: nats:4222
      ENGINE_URL: http://engine:8100
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      # Worker shards for live analytics; defaults to the CPU count, 2 to 8.
      LIVE_WORKERS: ${LIVE_WORKERS:-}
    depends_on:
      questdb:
        condition: service_started
      nats:
        condition: service_started
      engine:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
    environment:
      PORT: "8100"
      ENGINE_URL: http://engine:8100
      ANALYTICS_URL: http://analytics:8081
      # "off" tunnels /ws/stream to the engine unchanged, as before.
      STREAM_FANOUT: ${STREAM_FANOUT:-on}
      # The engine publishes ticks to the bus itself; the gateway only fans
      # the stream out to browsers. Empty DESK_URL serves the desk's routes
      # from the engine (MACD_ENGINE_ROLE=all).
      DESK_URL: ${DESK_URL-http://desk:8100}
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      MACD_ALLOWED_ORIGINS_CSV: ${MACD_ALLOWED_ORIGINS_CSV:-}
    ports:
      - "127.0.0.1:8201:8100"
    depends_on:
      engine:
        condition: service_healthy
      analytics:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      - gateway
    restart: unless-stopped

  us-backend:
    profiles: ["us"]
    build:
      context: ./us-app/backend
    environment:
      US_DATA_DIR: /data
      US_FINNHUB_API_KEY: ${US_FINNHUB_API_KEY:-}
      US_ALPHA_VANTAGE_API_KEY: ${US_ALPHA_VANTAGE_API_KEY:-}
    volumes:
      - us_paper_data:/data
    ports:
      - "127.0.0.1:8301:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  us-frontend:
    profiles: ["us"]
    build:
      context: ./us-app/frontend
    ports:
      - "127.0.0.1:3300:80"
    depends_on:
      us-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine_data:
  questdb_fyers_data:
  us_paper_data:
