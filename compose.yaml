name: macd-mini-parallel

services:
  # The strategy process: the only Fyers client, the MACD and blast lanes,
  # and the publisher of every accepted tick to the bus. MACD_ENGINE_ROLE=all
  # (with DESK_URL= for the gateway) puts the whole engine back in this one
  # process; the desk process then idles on its own.
  engine:
    # This deployment's own copy of the engine (see engine/README.md).
    build:
      context: ./engine
    image: macd-mini-parallel-engine
    environment:
      MACD_ENGINE_ROLE: ${MACD_ENGINE_ROLE:-strategy}
      MACD_HISTORY_DOWNLOADS_ENABLED: ${MACD_HISTORY_DOWNLOADS_ENABLED:-false}
      # Self-healing: exit on a wedged event loop so the restart policy brings the process back.
      MACD_LOOP_WATCHDOG: "1"
      MACD_NATS_URL: nats://nats:4222
      MACD_DESK_URL: http://desk:8100
      <<: &engine-databases
        # SQLite files live on a named volume, not the macOS bind mount: the
        # strategy and desk processes share historical.sqlite3, and only a
        # local filesystem gives SQLite reliable cross-process locking.
        MACD_DATABASE_PATH: /app/data/macd_trader.sqlite3
        MACD_RESEARCH_DATABASE_PATH: /app/data/historical.sqlite3
        MACD_MP_DATABASE_PATH: /app/data/mp_trader.sqlite3
        MACD_BLAST_DATABASE_PATH: /app/data/blast_trader.sqlite3
        MACD_TICK_DATABASE_PATH: /app/data/ticks.sqlite3
      MACD_FEED_MODE: fyers
      MACD_EXECUTION_MODE: paper
      MACD_ALLOW_LIVE_ORDERS: "false"
      MACD_AUTO_TRADE: "false"
      # Empty means the complete maintained NSE F&O stock universe plus indices.
      MACD_SYMBOLS_CSV: ${MACD_SYMBOLS_CSV:-}
      MACD_TIMEFRAME_SECONDS: ${MACD_TIMEFRAME_SECONDS:-60}
      MACD_RUNTIME_DIR: /app/runtime
      MACD_FYERS_CLIENT_ID: ${MACD_FYERS_CLIENT_ID:-}
      MACD_FYERS_SECRET: ${MACD_FYERS_SECRET:-}
      MACD_FYERS_ACCESS_TOKEN: ${MACD_FYERS_ACCESS_TOKEN:-}
      MACD_ALLOWED_ORIGINS_CSV: ${MACD_ALLOWED_ORIGINS_CSV:-}
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      # The agentic lane's brain (xAI Grok). Put XAI_API_KEY=... in the git-ignored .env beside this file;
      # empty leaves the lane in rules-only mode (it manages open positions and opens nothing).
      XAI_API_KEY: ${XAI_API_KEY:-}
      # The market-intelligence hub (~/CLAUDE PROJECTS/market-intelligence): Fyers data REST goes through it, straight to
      # Fyers for a minute whenever it fails; empty = call Fyers directly. The desk takes the same value.
      MACD_MARKET_HUB_URL: ${MACD_MARKET_HUB_URL:-}
      MACD_SHADOW_LANES_URL: http://shadow-lanes:8430
      LOCAL_DECISION_URL: http://local-decisions:8435
      LOCAL_DECISION_MODE: filter
    volumes:
      - ./runtime:/app/runtime
      - engine_data:/app/data
      # The permanent market-data archive (engine/src/macd_trader/archive.py): a host folder, outside Docker's
      # disk image, so a Docker reset cannot take it. The engine only reads it, to know what it may prune.
      - ./archive:/app/archive:ro
    depends_on:
      - nats
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # The Market Profile / order-flow lane: the auction desk and its book, tick
  # capture, the whale tracker and nightly memory. Same image, fed by the tick
  # bus and by the engine's contract context; broker calls and settings saves
  # go through the engine. Idle unless the engine runs as "strategy".
  desk:
    image: macd-mini-parallel-engine
    environment:
      MACD_ENGINE_ROLE: desk
      MACD_HISTORY_DOWNLOADS_ENABLED: ${MACD_HISTORY_DOWNLOADS_ENABLED:-false}
      MACD_LOOP_WATCHDOG: "1"
      MACD_NATS_URL: nats://nats:4222
      MACD_STRATEGY_URL: http://engine:8100
      <<: *engine-databases
      MACD_RUNTIME_DIR: /app/runtime
      MACD_LISTEN_HOST: 0.0.0.0
      MACD_EXECUTION_MODE: paper
      MACD_ALLOW_LIVE_ORDERS: "false"
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      MACD_MARKET_HUB_URL: ${MACD_MARKET_HUB_URL:-}
    volumes:
      # Read-only: the engine owns settings.json and the credentials.
      - ./runtime:/app/runtime:ro
      - engine_data:/app/data
      # The desk writes the archive (nightly seal of ticks, bars, chains, OI, flow).
      - ./archive:/app/archive
    depends_on:
      engine:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3))['ok']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Tick bus. Core NATS, no persistence: the engine's SQLite capture and the
  # archive are the durable records; the bus only fans ticks out. (QuestDB was
  # retired 24 Oct 2026: nothing in trading read it, and it cost ~315 MB and
  # ~9% CPU even idle. Analytics keeps its in-memory live state without it.)
  nats:
    image: nats:2.10-alpine
    # JetStream on, file-backed: the live feature stream (FT, 3 days) and the latest-snapshot KV bucket
    # (engine/src/macd_trader/live_features.py). Ticks stay on core subjects.
    command: ["--http_port", "8222", "-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
    environment:
      PORT: "8081"
      NATS_ADDR: nats:4222
      ENGINE_URL: http://engine:8100
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      # Worker shards for live analytics; defaults to the CPU count, 2 to 8.
      LIVE_WORKERS: ${LIVE_WORKERS:-}
    depends_on:
      nats:
        condition: service_started
      engine:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
    environment:
      PORT: "8100"
      ENGINE_URL: http://engine:8100
      ANALYTICS_URL: http://analytics:8081
      # "off" tunnels /ws/stream to the engine unchanged, as before.
      STREAM_FANOUT: ${STREAM_FANOUT:-on}
      # The engine publishes ticks to the bus itself; the gateway only fans
      # the stream out to browsers. Empty DESK_URL serves the desk's routes
      # from the engine (MACD_ENGINE_ROLE=all).
      DESK_URL: ${DESK_URL-http://desk:8100}
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      MACD_ALLOWED_ORIGINS_CSV: ${MACD_ALLOWED_ORIGINS_CSV:-}
    ports:
      - "127.0.0.1:8201:8100"
    depends_on:
      engine:
        condition: service_healthy
      analytics:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # The Upstox live lane (upstox_live/lane.py): follows MACD signals with REAL Upstox orders inside LANE_CAPITAL,
  # but only while runtime/upstox_live/ARMED contains "yes" (the owner creates it); otherwise it is a dry run that
  # journals what it would order. It reads signals through the gateway and never touches the engine or desk.
  upstox-live:
    image: macd-mini-parallel-engine
    entrypoint: ["python", "-u", "/lane/lane.py"]
    environment:
      ENGINE_URL: http://gateway:8100
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      MACD_ALLOWED_ORIGINS_CSV: ${MACD_ALLOWED_ORIGINS_CSV:-}
      HUB_URL: http://host.docker.internal:8400
      UPSTOX_TOKEN_FILE: /secrets/upstox.token
      STATE_DIR: /app/runtime/upstox_live
      LANE_CAPITAL: ${UPSTOX_LIVE_CAPITAL:-25000}
    volumes:
      - ./upstox_live:/lane:ro
      - ./runtime/upstox_live:/app/runtime/upstox_live
      # The platform's secrets FOLDER, read-only: the console replaces upstox.token / upstox-trade.token atomically on
      # every login, and a single-file bind mount keeps showing the deleted old file (8 Nov 2026, 13:32 login).
      # The lane reads only upstox.token (reads) and upstox-trade.token (the daily OAuth token, for orders).
      - /Users/ramachandran/CLAUDE PROJECTS/market-intelligence/secrets:/secrets:ro
    restart: unless-stopped

  # One local review worker; it has no order interface or access to trading books.
  local-decisions:
    image: tradebot-backend:latest
    entrypoint: ["python", "-m", "local_decisions.service"]
    working_dir: /macd
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:9b
      PAPER_LANES_ENABLED: "true"
      LOCAL_DECISION_DATABASE: /runtime/local_decisions/reviews.sqlite3
      LOCAL_CONTEXT_URL: http://shadow-lanes:8430
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./local_decisions:/macd/local_decisions:ro
      - ./runtime/local_decisions:/runtime/local_decisions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8435/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
    mem_limit: 384m
    restart: unless-stopped

  # Fresh paper books and candidate observations. No real-order interface or legacy book writer.
  shadow-lanes:
    profiles: ["shadow-lanes"]
    image: tradebot-backend:latest
    entrypoint: ["python", "-m", "shadow_lanes.service"]
    working_dir: /macd
    env_file: /Users/ramachandran/CLAUDE PROJECTS/market-intelligence/secrets/timescale.env
    environment:
      MI_PG_HOST: nomadcurie_db
      LANE_SOURCE_DB: nomadcurie
      VANGUARD_SOURCE: /vanguard
      VANGUARD_RUNTIME_DIR: /runtime/shadow_lanes/features
      SHADOW_DATABASE_PATH: /runtime/shadow_lanes/observations.sqlite3
      SHADOW_WORKER_ENABLED: ${SHADOW_WORKER_ENABLED:-false}
      PAPER_LANES_ENABLED: "true"
      CBE_DAILY_SWING_ENABLED: "true"
      PAPER_LANE_CAPITAL: ${PAPER_LANE_CAPITAL:-5000000}
      PAPER_LANES_DIR: /runtime/paper_lanes
      # Owner overrides 28 Oct 2026 (paper_lanes/book.py OVERRIDE_SERIES, applied in order up to this tag): CBE Rs 2 lakh per position;
      # Vanguard watchlist entered as published; then Vanguard 10 CE + 10 PE a day held to 3 sessions or the stop, no caps
      PAPER_OWNER_OVERRIDES: owner-20261028-list-test
      PAPER_HUB_URL: http://host.docker.internal:8400
      LANE_LIVE_NATS_URL: nats://market-intelligence-nats-1:4222
      MACD_API_TOKEN: ${MACD_API_TOKEN:-}
      TRADING_CALENDAR_FILE: /runtime/shadow_lanes/trading_calendar.json
      SHARED_MP_REDIS_URL: ""
      LOCAL_DECISION_URL: http://local-decisions:8435
      LOCAL_DECISION_MODE: filter
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./shadow_lanes:/macd/shadow_lanes:ro
      - ./paper_lanes:/macd/paper_lanes:ro
      - ./vanguard:/vanguard:ro
      - ./runtime/shadow_lanes:/runtime/shadow_lanes
      - ./runtime/paper_lanes:/runtime/paper_lanes
      - /Users/ramachandran/CLAUDE PROJECTS/Nomad Curie/TradeBot/backend/runtime/cbe_scanner/paper:/legacy/cbe:ro
      - /Users/ramachandran/CLAUDE PROJECTS/Nomad Curie/TradeBot/backend/runtime/vanguard:/legacy/vanguard:ro
    networks: [default, tradebot, market-data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8430/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  us-backend:
    profiles: ["us"]
    build:
      context: ./us-app/backend
    environment:
      US_DATA_DIR: /data
      US_FINNHUB_API_KEY: ${US_FINNHUB_API_KEY:-}
      US_ALPHA_VANTAGE_API_KEY: ${US_ALPHA_VANTAGE_API_KEY:-}
    volumes:
      - us_paper_data:/data
    ports:
      - "127.0.0.1:8301:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  us-frontend:
    profiles: ["us"]
    build:
      context: ./us-app/frontend
    ports:
      - "127.0.0.1:3300:80"
    depends_on:
      us-backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  market-data:
    external: true
    name: market-intelligence_default
  tradebot:
    external: true
    name: tradebot_default

volumes:
  engine_data:
    name: macd-recovery-20261025-engine-data
  nats_data:
    name: macd-recovery-20261025-nats-data
  us_paper_data:
