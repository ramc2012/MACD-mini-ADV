server {
    listen 80;
    server_name _;

    # The engine snapshot is ~1.7 MB of repetitive JSON (~330 KB gzipped) and
    # the bundle ~580 KB (~180 KB). Websocket frames are compressed by the
    # gateway itself (permessage-deflate), not here.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_vary on;

    location /api/ {
        proxy_pass http://gateway:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://gateway:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://gateway:8100/health;
    }

    location /parallel/ {
        proxy_pass http://gateway:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite fingerprints every asset, so those may be cached forever, but the
    # entry document must NOT be: it is what names the current fingerprints.
    # Served with only an ETag it fell to heuristic caching, and a browser
    # that had opened the terminal before a deploy kept the previous build --
    # a phone silently ran the old layout until someone hard-refreshed it,
    # which is exactly the device where that is hardest to do.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
