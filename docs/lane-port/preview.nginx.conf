server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8100;
    location /api/shadow-lanes/ { proxy_pass http://macd-shadow-lanes-preview:8430; }
    location /api/ { proxy_pass $gateway; }
    location /health { proxy_pass $gateway/health; }
    location /ws/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
